<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#0d0b0a">
<title>SJL 보드게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" id="brandLink"><span class="logo">🎲</span><span>SJL 보드게임</span></a>
  <div class="who">
    <button id="nickBtn" class="nickBtn" title="닉네임 바꾸기"><span class="av" id="nickAv">?</span><span id="nickLabel">닉네임</span></button>
    <span id="conn" class="pill off">연결 중…</span>
  </div>
</header>

<main id="lobby" class="wrap">
  <section class="hero">
    <div class="heroText">
      <h1>함께 하는 <em>3D 보드게임</em></h1>
      <p>방을 만들고 친구에게 QR코드나 방 코드를 알려주세요. 각자 자기 폰으로 같이 할 수 있어요.</p>
    </div>
    <form class="joinBox" id="joinForm">
      <label for="joinCode">방 코드로 입장</label>
      <div class="joinRow">
        <input id="joinCode" class="code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" inputmode="text">
        <button id="joinBtn" class="primary big" type="submit">입장</button>
      </div>
      <button id="spectateBtn" class="linkBtn" type="button">관전으로 들어가기</button>
    </form>
  </section>

  <section>
    <h2 class="secTitle">게임 고르기</h2>
    <div id="gameGrid" class="gameGrid"></div>
  </section>

  <section id="roomsSec">
    <h2 class="secTitle">지금 열려 있는 방</h2>
    <div id="roomList" class="roomList"></div>
  </section>
</main>

<main id="room" class="wrap roomWrap hidden">
  <section class="roomHead">
    <div class="roomTitle">
      <span id="roomEmoji" class="roomEmoji"></span>
      <div>
        <h2 id="roomGame"></h2>
        <div class="roomSub">방 코드 <span id="roomCode" class="code-badge"></span></div>
      </div>
    </div>
    <div class="roomActions">
      <button id="readyBtn" class="primary hidden">준비</button>
      <button id="rematchBtn" class="primary hidden">한 판 더</button>
      <button id="rulesBtn" class="ghost" title="규칙">📖<span class="lbl"> 규칙</span></button>
      <button id="inviteBtn" class="ghost" title="초대">📱<span class="lbl"> 초대</span></button>
      <button id="muteBtn" class="ghost" title="효과음">🔊</button>
      <button id="leaveBtn" class="ghost">나가기</button>
    </div>
    <div id="seatList" class="seats"></div>
  </section>
  <section class="playArea">
    <div id="board" class="board"></div>
    <aside class="side">
      <div id="status" class="status"></div>
      <div id="panelExtra"></div>
      <details class="chat" id="chatBox">
        <summary>💬 채팅 <span id="chatBadge" class="badge hidden"></span></summary>
        <div id="chatLog" class="chatLog"></div>
        <form id="chatForm"><input id="chatInput" maxlength="300" placeholder="메시지 입력…" autocomplete="off"><button>전송</button></form>
      </details>
    </aside>
  </section>
</main>

<footer class="credit">Made by <b>임서준</b> · SJL 보드게임</footer>

<div id="toast" class="toast hidden"></div>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
</script>
<script src="/vendor/qrcode.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
